<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine Interactive Digital Card Game</title>
  <style>
    :root {
      --red: #d62856;
      --dark-red: #8f1236;
      --pink: #ff87a8;
      --light-pink: #ffe8ee;
      --white: #fff;
      --ink: #4e1030;
      --pixel-shadow: 0 3px 0 #8d1e41;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Courier New", monospace;
      background: linear-gradient(#ffeef4, #ffd6e3);
      color: var(--ink);
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .game-shell {
      width: min(960px, 96vw);
      min-height: min(640px, 92vh);
      border: 8px solid var(--dark-red);
      box-shadow: 0 0 0 8px #fff, 0 14px 30px rgba(80, 0, 20, 0.25);
      background: #fff;
      position: relative;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      padding: 24px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      background: var(--light-pink);
      border: 10px dotted #fff;
      animation: fadeIn 0.3s ease;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn { from {opacity: .5; transform: scale(.99);} to {opacity: 1; transform: scale(1);} }
    @keyframes pulse { 0%,100% {transform: scale(1);} 50% {transform: scale(1.03);} }

    .pixel-title,
    .pixel-heading,
    .pixel-btn,
    .pixel-label {
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: var(--pixel-shadow);
      font-weight: 900;
    }

    .pixel-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--red);
      text-align: center;
      margin: 20px 0 8px;
      line-height: 1.1;
    }

    .subtitle {
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: #7c2b46;
      margin-bottom: 12px;
    }

    .hearts-bg::before {
      content: "❤ ❤ ❤ ❤ ❤";
      position: absolute;
      top: 10px;
      left: 10px;
      color: #e95c88;
      font-size: 1.2rem;
      opacity: 0.7;
    }
    .hearts-bg::after {
      content: "❤ ❤ ❤";
      position: absolute;
      right: 24px;
      bottom: 24px;
      color: #d73666;
      font-size: 1.3rem;
      opacity: 0.7;
    }

    .screen-content-center {
      flex: 1;
      display: grid;
      place-content: center;
      gap: 16px;
      position: relative;
    }

    .pixel-btn {
      border: 3px solid var(--dark-red);
      background: var(--red);
      color: #fff;
      padding: 12px 24px;
      cursor: pointer;
      align-self: center;
      font-size: 1.05rem;
      min-width: 130px;
      box-shadow: 4px 4px 0 #7b0f31;
      transition: transform .1s ease, filter .15s ease, box-shadow .1s ease;
    }
    .pixel-btn:hover { filter: brightness(1.12); transform: translate(-1px, -1px); }
    .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #7b0f31; }
    .pixel-btn:disabled { opacity: .5; cursor: not-allowed; }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .pixel-heading {
      font-size: clamp(1.5rem, 3.2vw, 2.4rem);
      color: #fff;
      text-align: center;
      margin: 8px 0;
    }

    .red-screen {
      background: radial-gradient(circle at top right, #e6517a 0, var(--red) 40%, #b70f43 100%);
      color: #fff;
    }

    .players {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(16px, 4vw, 60px);
      flex-wrap: wrap;
    }

    .player-card {
      border: 4px solid #fff;
      background: rgba(255,255,255,.18);
      padding: 12px;
      width: 190px;
      text-align: center;
      box-shadow: 4px 4px 0 rgba(0,0,0,.25);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px;
      border: 4px solid #fff;
      background: linear-gradient(135deg, #ffd7e5, #ff9ebe);
      position: relative;
      image-rendering: pixelated;
      display: grid;
      place-items: center;
      font-size: 2rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--red);
      font-size: 1.3rem;
      font-weight: 700;
    }

    .progress-wrap {
      width: 190px;
      border: 3px solid #b22955;
      padding: 2px;
      background: #fff;
      height: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: repeating-linear-gradient(90deg, #ff7ca4 0 10px, #e64575 10px 20px);
      transition: width .3s ease;
    }

    .card-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .envelope {
      width: 175px;
      height: 120px;
      border: 4px solid #75122f;
      background: linear-gradient(180deg, #f04f7d, #c72652);
      position: relative;
      cursor: pointer;
      box-shadow: 4px 5px 0 #7e1636;
      transition: transform .15s ease, filter .15s ease;
      color: #fff;
      font-weight: 700;
      display: grid;
      align-items: end;
      justify-items: center;
      padding-bottom: 8px;
    }
    .envelope::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      height: 45px;
      border-left: 4px solid #790f34;
      border-right: 4px solid #790f34;
      border-bottom: 4px solid #790f34;
      transform: skewY(-16deg);
      opacity: .8;
    }
    .envelope:hover { transform: translateY(-3px); filter: brightness(1.06); }
    .envelope.selected { outline: 4px solid #fff; transform: translateY(-4px) scale(1.03); }
    .envelope.seen { opacity: .45; }

    .openable {
      margin: 0 auto;
      width: min(300px, 80vw);
      height: 200px;
      display: grid;
      place-items: center;
      animation: pulse 1s infinite;
    }

    .open-envelope {
      width: 100%;
      height: 100%;
      border: 4px solid #6f0b2e;
      background: linear-gradient(#ff7aa3, #d6204f);
      cursor: pointer;
      position: relative;
      box-shadow: 5px 6px 0 #740a2f;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stamp-border {
      border: 10px dashed #fff;
      padding: 14px;
      height: 100%;
    }

    .heart-note {
      width: 220px;
      height: 200px;
      margin: 0 auto;
      background: #fff;
      color: #b31243;
      clip-path: path('M110,196 C5,130 0,60 50,40 C75,30 95,40 110,60 C125,40 145,30 170,40 C220,60 215,130 110,196 Z');
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .message {
      text-align: center;
      max-width: 720px;
      margin: 8px auto;
      font-size: 1rem;
    }

    .collage {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 12px;
    }

    .photo {
      width: 130px;
      height: 110px;
      border: 5px solid #fff;
      background: #ffcfe0;
      object-fit: cover;
      box-shadow: 4px 4px 0 rgba(70,0,20,.35);
      image-rendering: pixelated;
    }

    .photo.polaroid {
      width: 140px;
      height: 150px;
      padding: 8px 8px 28px;
      background: #fff;
      border: 2px solid #f4b9cc;
    }
    .photo.polaroid img,
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

    .photo-wrap {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffe1ec, #ff9fbe);
      display: grid;
      place-items: center;
      color: #8b2949;
      font-size: .8rem;
      text-align: center;
      padding: 6px;
    }

    .letter-box {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      color: #6b1533;
      border: 5px solid #f9bfd1;
      padding: 18px;
      box-shadow: 6px 6px 0 rgba(0,0,0,.22);
      line-height: 1.5;
      overflow-y: auto;
      max-height: 60vh;
    }

    .heart-photo {
      width: 120px;
      height: 120px;
      margin: 12px auto 0;
      clip-path: polygon(50% 95%, 5% 50%, 5% 35%, 20% 15%, 35% 15%, 50% 30%, 65% 15%, 80% 15%, 95% 35%, 95% 50%);
      border: 4px solid #fff;
      overflow: hidden;
      background: #ffd7e4;
    }

    .yes-no {
      display: flex;
      justify-content: center;
      gap: 16px;
      align-items: center;
      margin: 18px 0;
      min-height: 130px;
    }

    .clean {
      background: #fff;
      border: none;
      display: grid;
      place-items: center;
    }

    @media (max-width: 600px) {
      .game-shell { min-height: 96vh; width: 100vw; border-width: 5px; }
      .screen { padding: 14px; }
      .envelope { width: 150px; height: 105px; }
      .heart-note { transform: scale(.9); }
    }
  </style>
</head>
<body>
  <div class="game-shell" id="gameShell">
    <section id="screen1" class="screen active hearts-bg">
      <div class="screen-content-center">
        <h1 class="pixel-title">VALENTINE GAME NIGHT</h1>
        <p class="subtitle">made this just for you!</p>
        <button class="pixel-btn" data-go="screen2">START</button>
      </div>
    </section>

    <section id="screen2" class="screen red-screen">
      <h2 class="pixel-heading">READY TO PLAY?</h2>
      <div class="players">
        <article class="player-card">
          <div class="pixel-label">PLAYER 1</div>
          <div class="avatar">👾</div>
          <div id="player1Name" class="pixel-label"></div>
        </article>
        <article class="player-card">
          <div class="pixel-label">PLAYER 2</div>
          <div class="avatar">🐱</div>
          <div id="player2Name" class="pixel-label"></div>
        </article>
      </div>
      <div class="footer-actions">
        <button class="pixel-btn" data-go="screen3">NEXT</button>
      </div>
    </section>

    <section id="screen3" class="screen">
      <div class="topbar">
        <span>❤️❤️❤️</span>
        <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <div class="screen-content-center">
        <h2 class="pixel-title" style="font-size:2.2rem; margin:0;">PICK A CARD!</h2>
        <div class="card-row" id="cardPicker"></div>
      </div>
      <div class="footer-actions">
        <button id="toOpenBtn" class="pixel-btn" disabled>NEXT</button>
      </div>
    </section>

    <section id="screen4" class="screen">
      <div class="topbar">
        <span>❤️❤️❤️</span>
        <div class="progress-wrap"><div id="progressBar2" class="progress-bar"></div></div>
      </div>
      <div class="screen-content-center">
        <p class="pixel-label" style="text-align:center; color:#c22857;">CLICK TO OPEN</p>
        <div class="openable">
          <button id="openChosenCard" class="open-envelope">OPEN SELECTED CARD</button>
        </div>
      </div>
    </section>

    <section id="screen5" class="screen red-screen">
      <div class="stamp-border">
        <h2 class="pixel-heading" id="card1Title"></h2>
        <div class="heart-note" id="card1HeartText"></div>
        <p class="message" id="card1Message"></p>
        <div class="collage" id="card1Collage"></div>
      </div>
      <div class="footer-actions"><button class="pixel-btn" id="card1Next">NEXT</button></div>
    </section>

    <section id="screen6" class="screen red-screen">
      <h2 class="pixel-heading" id="card2Title"></h2>
      <div class="collage" id="memoriesCollage"></div>
      <div class="footer-actions"><button class="pixel-btn" id="card2Next">NEXT</button></div>
    </section>

    <section id="screen7" class="screen red-screen">
      <h2 class="pixel-heading">LETTER FOR YOU</h2>
      <div class="letter-box" id="letterText"></div>
      <div class="heart-photo" id="heartPhoto"></div>
      <div class="footer-actions"><button class="pixel-btn" id="card3Next">NEXT</button></div>
    </section>

    <section id="screen8" class="screen red-screen">
      <div class="screen-content-center">
        <h2 class="pixel-heading" style="max-width: 780px; margin-inline: auto;">COULD YOU GIVE ME THE BLESSING OF BEING YOUR VALENTINE?</h2>
        <div class="yes-no">
          <button id="inviteYes" class="pixel-btn" style="font-size:1.2rem;">YES</button>
          <button id="inviteNo" class="pixel-btn" style="font-size:1.2rem; background:#fff; color:#b31845;">NO</button>
        </div>
      </div>
    </section>

    <section id="screen9" class="screen red-screen" style="border:10px dashed #fff;">
      <div class="screen-content-center">
        <h2 class="pixel-title" style="color:#fff; margin:0;">GAME OVER</h2>
        <p class="subtitle" style="color:#ffe8ef;">PLAY AGAIN?</p>
        <div class="yes-no">
          <button id="gameOverYes" class="pixel-btn">YES</button>
          <button id="gameOverNo" class="pixel-btn" style="background:#fff; color:#b31845;">NO</button>
        </div>
      </div>
    </section>

    <section id="screen10" class="screen clean">
      <div class="screen-content-center">
        <h2 class="pixel-title" style="color:#ce2554;">Gracias bonita, te amo ❤️</h2>
      </div>
    </section>
  </div>

  <script>
    const GAME_DATA = {
      player1: "ANELISSE",
      player2: "ISABEL",
      card1: {
        title: "Happy Valentine's Day Baby",
        images: ["img1.jpg", "img2.jpg", "img3.jpg"],
        message: "You are my favorite person, my peace, and my home. Thank you for being you.",
      },
      card2: {
        title: "Our Memories",
        images: ["mem1.jpg", "mem2.jpg", "mem3.jpg", "mem4.jpg", "mem5.jpg"],
      },
      card3: {
        letterText:
          "Happy Valentine's Day to the one who makes everything better.\n\nThank you for your patience, your laughter, your hugs, and all the little moments that turn into beautiful memories. I choose you today, tomorrow, and always. You are deeply loved.",
        heartImage: "heartPhoto.jpg",
      },
    };

    const SCREENS = Array.from(document.querySelectorAll('.screen'));
    const state = {
      currentScreen: 'screen1',
      selectedCard: null,
      seenCards: new Set(),
      noClicks: 0,
    };

    function showScreen(id) {
      SCREENS.forEach((s) => s.classList.toggle('active', s.id === id));
      state.currentScreen = id;
      updateProgressBars();
      if (id === 'screen3') renderCardPicker();
      if (id === 'screen4') renderOpenCardButton();
    }

    function resetGame() {
      state.selectedCard = null;
      state.seenCards = new Set();
      state.noClicks = 0;
      document.getElementById('inviteNo').style.display = 'inline-block';
      document.getElementById('inviteNo').style.transform = 'scale(1)';
      document.getElementById('inviteYes').style.transform = 'scale(1)';
      showScreen('screen1');
    }

    function updateProgressBars() {
      const width = `${(state.seenCards.size / 3) * 100}%`;
      document.getElementById('progressBar').style.width = width;
      document.getElementById('progressBar2').style.width = width;
    }

    function renderDynamicText() {
      document.getElementById('player1Name').textContent = GAME_DATA.player1;
      document.getElementById('player2Name').textContent = GAME_DATA.player2;

      document.getElementById('card1Title').textContent = GAME_DATA.card1.title;
      document.getElementById('card1HeartText').textContent = GAME_DATA.card1.title;
      document.getElementById('card1Message').textContent = GAME_DATA.card1.message;

      document.getElementById('card2Title').textContent = GAME_DATA.card2.title;
      document.getElementById('letterText').innerText = GAME_DATA.card3.letterText;

      renderImageGroup('card1Collage', GAME_DATA.card1.images, false);
      renderImageGroup('memoriesCollage', GAME_DATA.card2.images, true);
      renderHeartImage();
    }

    function renderHeartImage() {
      const el = document.getElementById('heartPhoto');
      el.innerHTML = '';
      const img = new Image();
      img.src = GAME_DATA.card3.heartImage;
      img.alt = 'Heart photo';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.onerror = () => {
        el.innerHTML = '<div class="photo-wrap">heartImage<br/>placeholder</div>';
      };
      el.appendChild(img);
    }

    function renderImageGroup(containerId, images, polaroid) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      images.forEach((src, i) => {
        const wrapper = document.createElement('div');
        wrapper.className = polaroid ? 'photo polaroid' : 'photo';
        const imgBox = document.createElement('div');
        imgBox.className = 'photo-wrap';

        const img = new Image();
        img.src = src;
        img.alt = `image ${i + 1}`;
        img.loading = 'lazy';

        img.onerror = () => {
          imgBox.textContent = `Replace\n${src}`;
        };

        img.onload = () => {
          imgBox.innerHTML = '';
          imgBox.appendChild(img);
        };

        imgBox.textContent = `Replace\n${src}`;
        wrapper.appendChild(imgBox);
        container.appendChild(wrapper);
      });
    }

    function renderCardPicker() {
      const picker = document.getElementById('cardPicker');
      picker.innerHTML = '';
      for (let i = 1; i <= 3; i++) {
        const card = document.createElement('button');
        card.className = 'envelope';
        if (state.selectedCard === i) card.classList.add('selected');
        if (state.seenCards.has(i)) card.classList.add('seen');
        card.innerHTML = `<span style="font-size:1.5rem;">💌</span><span>CARD ${i}</span>`;
        card.onclick = () => {
          state.selectedCard = i;
          document.getElementById('toOpenBtn').disabled = false;
          renderCardPicker();
        };
        picker.appendChild(card);
      }
      document.getElementById('toOpenBtn').disabled = !state.selectedCard;
    }

    function renderOpenCardButton() {
      const btn = document.getElementById('openChosenCard');
      btn.textContent = state.selectedCard ? `OPEN CARD ${state.selectedCard}` : 'SELECT A CARD FIRST';
      btn.disabled = !state.selectedCard;
    }

    function goToResultFromCard() {
      if (!state.selectedCard) return;
      if (state.selectedCard === 1) showScreen('screen5');
      if (state.selectedCard === 2) showScreen('screen6');
      if (state.selectedCard === 3) showScreen('screen7');
      state.seenCards.add(state.selectedCard);
      updateProgressBars();
    }

    function handleResultNext() {
      if (state.seenCards.size === 3) {
        showScreen('screen8');
      } else {
        state.selectedCard = null;
        showScreen('screen3');
      }
    }

    document.querySelectorAll('[data-go]').forEach((btn) => {
      btn.addEventListener('click', () => showScreen(btn.dataset.go));
    });

    document.getElementById('toOpenBtn').addEventListener('click', () => showScreen('screen4'));
    document.getElementById('openChosenCard').addEventListener('click', goToResultFromCard);
    document.getElementById('card1Next').addEventListener('click', handleResultNext);
    document.getElementById('card2Next').addEventListener('click', handleResultNext);
    document.getElementById('card3Next').addEventListener('click', handleResultNext);

    document.getElementById('inviteNo').addEventListener('click', () => {
      state.noClicks += 1;
      const yes = document.getElementById('inviteYes');
      const no = document.getElementById('inviteNo');
      yes.style.transform = `scale(${1 + state.noClicks * 0.25})`;
      no.style.transform = `scale(${Math.max(1 - state.noClicks * 0.22, 0)})`;
      if (state.noClicks >= 4) no.style.display = 'none';
    });

    document.getElementById('inviteYes').addEventListener('click', () => showScreen('screen9'));
    document.getElementById('gameOverYes').addEventListener('click', resetGame);
    document.getElementById('gameOverNo').addEventListener('click', () => showScreen('screen10'));

    renderDynamicText();
    resetGame();
  </script>
</body>
</html>
